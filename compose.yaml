x-etl: &etl
  build:
    context: ./etl
  image: urbandynamics-etl:latest
  env_file:
    - .env

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      SCENARIO_DATA_DIR: /runtime/scenarios
      SIMULATION_WORK_DIR: /runtime/solvers
    volumes:
      - ./data:/data:ro
      - simulation_runtime:/runtime
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  etl-population-hcmc:
    <<: *etl
    profiles: ["etl-population-hcmc"]
    command: ["python", "-m", "src.main", "population_hcmc"]
    volumes:
      - ./etl/data:/app/data

  etl-rainwater:
    <<: *etl
    profiles: ["etl-rainwater"]
    command: ["python", "-m", "src.khoi_service", "--jobs", "forecast", "history"]
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      DATA_DIR: /data
      HCMC_BOUNDARY: /data/inputs/hcmc_expanded_boundary.geojson

volumes:
  simulation_runtime:
