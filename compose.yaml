x-etl: &etl
  build:
    context: ./etl
  image: urbandynamics-etl:latest
  env_file:
    - .env
  volumes:
    - ./etl/data:/app/data
    - ./scripts:/app/scripts:ro

x-warehouse-env: &warehouse-env
  WAREHOUSE_HOST: postgis
  WAREHOUSE_PORT: "5432"
  WAREHOUSE_DATABASE: ${WAREHOUSE_DATABASE:-urbandynamics}
  WAREHOUSE_USER: ${WAREHOUSE_USER:-urbandynamics}
  WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-}

services:
  postgis:
    build:
      context: ./infra/warehouse
    image: urbandynamics-postgis:17-3.5
    environment:
      POSTGRES_DB: ${WAREHOUSE_DATABASE:-urbandynamics}
      POSTGRES_USER: ${WAREHOUSE_USER:-urbandynamics}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: urbandynamics-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      <<: *warehouse-env
      DATA_DIR: /data
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-}
    volumes:
      - ./etl/data:/data:ro
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOONG_MAPTILES_KEY: ${VITE_GOONG_MAPTILES_KEY:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  etl-population-hcmc:
    <<: *etl
    profiles: ["etl-population-hcmc"]
    environment:
      <<: *warehouse-env
      ETL_PIPELINE: population_hcmc
    command: ["run"]
    depends_on:
      postgis:
        condition: service_healthy

  etl-flood-history:
    <<: *etl
    profiles: ["etl-flood-history"]
    environment:
      <<: *warehouse-env
      DATA_DIR: /app/data
      ETL_PIPELINE: flood_history
    command: ["run"]
    depends_on:
      postgis:
        condition: service_healthy

  etl-flood-satellite:
    <<: *etl
    profiles: ["etl-flood-satellite"]
    environment:
      <<: *warehouse-env
      DATA_DIR: /app/data
      ETL_PIPELINE: flood_satellite
    command: ["run"]
    depends_on:
      postgis:
        condition: service_healthy

  etl-flood-risk:
    <<: *etl
    profiles: ["etl-flood-risk"]
    environment:
      <<: *warehouse-env
      DATA_DIR: /app/data
      ETL_PIPELINE: flood_risk
    command: ["run"]
    depends_on:
      postgis:
        condition: service_healthy

  etl-land-price:
    <<: *etl
    profiles: ["etl-land-price"]
    environment:
      <<: *warehouse-env
      DATA_DIR: /app/data
      ETL_PIPELINE: land_price
    command: ["run"]
    depends_on:
      postgis:
        condition: service_healthy

  etl-parcels-hcmc:
    <<: *etl
    profiles: ["etl-parcels-hcmc"]
    environment:
      <<: *warehouse-env
      DATA_DIR: /app/data
      ETL_PIPELINE: parcels_hcmc
    command: ["run"]
    depends_on:
      postgis:
        condition: service_healthy

  etl-buildings-footprint:
    <<: *etl
    profiles: ["etl-buildings-footprint"]
    environment:
      <<: *warehouse-env
      DATA_DIR: /app/data
      ETL_PIPELINE: buildings_footprint
    command: ["run"]
    depends_on:
      postgis:
        condition: service_healthy

  khoi-checks:
    build:
      context: .
      dockerfile: infra/testing/Dockerfile
    image: urbandynamics-khoi-checks:latest
    profiles: ["checks"]
    environment:
      <<: *warehouse-env
      POSTGIS_TESTS: "1"
    volumes:
      - ./test-results:/app/test-results
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  postgis_data:
