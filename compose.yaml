x-etl: &etl
  build:
    context: ./etl
  image: urbandynamics-etl:latest
  env_file:
    - .env
  volumes:
    - ./etl/data:/app/data
    - ./scripts:/app/scripts:ro

x-warehouse-env: &warehouse-env
  WAREHOUSE_HOST: postgis
  WAREHOUSE_PORT: "5432"
  WAREHOUSE_DATABASE: ${WAREHOUSE_DATABASE:-urbandynamics}
  WAREHOUSE_USER: ${WAREHOUSE_USER:-urbandynamics}
  WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-}

services:
  postgis:
    build:
      context: ./infra/warehouse
    image: urbandynamics-postgis:17-3.5
    environment:
      POSTGRES_DB: ${WAREHOUSE_DATABASE:-urbandynamics}
      POSTGRES_USER: ${WAREHOUSE_USER:-urbandynamics}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: urbandynamics-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      <<: *warehouse-env
      DATA_DIR: /data
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-}
      SCENARIO_DATA_DIR: /runtime/scenarios
      SIMULATION_WORK_DIR: /runtime/solvers
    volumes:
      - ./etl/data:/data:ro
      - simulation_runtime:/runtime
    depends_on:
      postgis:
        condition: service_healthy
      planning-worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    environment:
      BACKEND_UPSTREAM: ${COMPOSE_PROJECT_NAME:-urbandynamics}-backend-1:8000
    build:
      context: ./frontend
      args:
        VITE_GOONG_MAPTILES_KEY: ${VITE_GOONG_MAPTILES_KEY:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  planning-worker:
    image: urbandynamics-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.services.simulation.planning.worker"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *warehouse-env
      DATA_DIR: /data
      SIMULATION_WORK_DIR: /runtime/solvers
      PLANNING_MAX_RUNNING: 2
    volumes:
      - ./etl/data:/data:ro
      - simulation_runtime:/runtime
    depends_on:
      postgis:
        condition: service_healthy

  etl-population-hcmc:
    <<: *etl
    profiles: ["etl-population-hcmc"]
    environment:
      <<: *warehouse-env
      ETL_PIPELINE: population_hcmc
    command: ["run"]
    depends_on:
      postgis:
        condition: service_healthy

  etl-flood-history:
    <<: *etl
    profiles: ["etl-flood-history"]
    environment:
      <<: *warehouse-env
      DATA_DIR: /app/data
      ETL_PIPELINE: flood_history
    command: ["run"]
    depends_on:
      postgis:
        condition: service_healthy

  etl-flood-satellite:
    <<: *etl
    profiles: ["etl-flood-satellite"]
    environment:
      <<: *warehouse-env
      DATA_DIR: /app/data
      ETL_PIPELINE: flood_satellite
    command: ["run"]
    depends_on:
      postgis:
        condition: service_healthy

  etl-flood-risk:
    <<: *etl
    profiles: ["etl-flood-risk"]
    environment:
      <<: *warehouse-env
      DATA_DIR: /app/data
      ETL_PIPELINE: flood_risk
    command: ["run"]
    depends_on:
      postgis:
        condition: service_healthy

  etl-land-price:
    <<: *etl
    profiles: ["etl-land-price"]
    environment:
      <<: *warehouse-env
      DATA_DIR: /app/data
      ETL_PIPELINE: land_price
    command: ["run"]
    depends_on:
      postgis:
        condition: service_healthy

  etl-parcels-hcmc:
    <<: *etl
    profiles: ["etl-parcels-hcmc"]
    environment:
      <<: *warehouse-env
      DATA_DIR: /app/data
      ETL_PIPELINE: parcels_hcmc
    command: ["run"]
    depends_on:
      postgis:
        condition: service_healthy

  etl-buildings-footprint:
    <<: *etl
    profiles: ["etl-buildings-footprint"]
    environment:
      <<: *warehouse-env
      DATA_DIR: /app/data
      ETL_PIPELINE: buildings_footprint
    command: ["run"]
    depends_on:
      postgis:
        condition: service_healthy

  etl-buildings-footprint-gba:
    <<: *etl
    profiles: ["etl-buildings-footprint-gba"]
    environment:
      <<: *warehouse-env
      DATA_DIR: /app/data
      ETL_PIPELINE: buildings_footprint_gba
    command: ["run"]
    depends_on:
      postgis:
        condition: service_healthy

  etl-model-generation:
    <<: *etl
    profiles: ["etl-model-generation"]
    environment:
      <<: *warehouse-env
      DATA_DIR: /app/data
      ETL_PIPELINE: model_generation
    command: ["run"]
    depends_on:
      postgis:
        condition: service_healthy

  etl-osm-sumo-hcmc:
    <<: *etl
    profiles: ["etl-osm-sumo-hcmc", "traffic_feat"]
    environment:
      <<: *warehouse-env
      DATA_DIR: /app/data
      ETL_PIPELINE: osm_sumo_hcmc
    command: ["run"]
    depends_on:
      postgis:
        condition: service_healthy

  etl-traffic-history:
    <<: *etl
    profiles: ["etl-traffic-history", "traffic_feat"]
    environment:
      <<: *warehouse-env
      DATA_DIR: /app/data
      ETL_PIPELINE: traffic_history
    command: ["run"]
    depends_on:
      postgis:
        condition: service_healthy

  etl-road-data-tomtom:
    <<: *etl
    profiles: ["etl-road-data-tomtom", "traffic_feat"]
    environment:
      <<: *warehouse-env
      DATA_DIR: /app/data
      ETL_PIPELINE: road_data_tomtom
    command: ["run"]
    depends_on:
      postgis:
        condition: service_healthy

  khoi-checks:
    build:
      context: .
      dockerfile: infra/testing/Dockerfile
    image: urbandynamics-khoi-checks:latest
    profiles: ["checks"]
    environment:
      <<: *warehouse-env
      POSTGIS_TESTS: "1"
      TEST_DATABASE_URL: postgresql://${WAREHOUSE_USER:-urbandynamics}:${WAREHOUSE_PASSWORD:-}@postgis:5432/${WAREHOUSE_DATABASE:-urbandynamics}
    volumes:
      - ./test-results:/app/test-results
    depends_on:
      postgis:
        condition: service_healthy

  etl-rainwater:
    <<: *etl
    profiles: ["etl-rainwater"]
    entrypoint: ["python", "-m", "src.khoi_service"]
    command: []
    restart: unless-stopped
    environment:
      <<: *warehouse-env
      DATA_DIR: /app/data
      HCMC_BOUNDARY: /app/data/inputs/hcmc_expanded_boundary.geojson
      RAIN_GRID_M: ${RAIN_GRID_M:-10000}
      RAIN_BATCH_SIZE: ${RAIN_BATCH_SIZE:-10}
      RAIN_HISTORY_START_YEAR: ${RAIN_HISTORY_START_YEAR:-2016}
      RAIN_HISTORY_END_YEAR: ${RAIN_HISTORY_END_YEAR:-}
      RAIN_HISTORY_STATIONS_PER_RUN: ${RAIN_HISTORY_STATIONS_PER_RUN:-4}
      RAIN_REFRESH_SECONDS: ${RAIN_REFRESH_SECONDS:-3600}
      RAIN_HISTORY_REFRESH_SECONDS: ${RAIN_HISTORY_REFRESH_SECONDS:-300}
      SATELLITE_REFRESH_SECONDS: ${SATELLITE_REFRESH_SECONDS:-21600}
      FLOOD_HISTORY_REFRESH_SECONDS: ${FLOOD_HISTORY_REFRESH_SECONDS:-604800}
      LAND_PRICE_REFRESH_SECONDS: ${LAND_PRICE_REFRESH_SECONDS:-2592000}
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  postgis_data:
  simulation_runtime:
