x-etl: &etl
  build:
    context: ./etl
  image: urbandynamics-etl:latest
  env_file:
    - .env

x-warehouse-env: &warehouse-env
  WAREHOUSE_HOST: postgis
  WAREHOUSE_PORT: "5432"
  WAREHOUSE_DATABASE: ${WAREHOUSE_DATABASE:-urbandynamics}
  WAREHOUSE_USER: ${WAREHOUSE_USER:-urbandynamics}
  WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-}

services:
  postgis:
    build:
      context: ./infra/warehouse
    image: urbandynamics-postgis:17-3.5
    environment:
      POSTGRES_DB: ${WAREHOUSE_DATABASE:-urbandynamics}
      POSTGRES_USER: ${WAREHOUSE_USER:-urbandynamics}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOONG_MAPTILES_KEY: ${VITE_GOONG_MAPTILES_KEY:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  etl-population-hcmc:
    <<: *etl
    profiles: ["etl-population-hcmc"]
    environment:
      <<: *warehouse-env
      ETL_PIPELINE: population_hcmc
    command: ["run"]
    depends_on:
      postgis:
        condition: service_healthy
    volumes:
      - ./etl/data:/app/data

  etl-rainwater:
    <<: *etl
    profiles: ["etl-rainwater"]
    environment:
      <<: *warehouse-env
      ETL_PIPELINE: rainwater
    command: ["run"]
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  postgis_data:
