# Standalone local stack for Khoi; no dependency on Duy's unfinished pipelines.
services:
  warehouse:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: urban
      POSTGRES_USER: urban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or shell}
    ports:
      - "127.0.0.1:${KHOI_DB_PORT:-55432}:5432"
    volumes:
      - khoi_database:/var/lib/postgresql/data
      - ./infra/warehouse/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urban -d urban"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://urban:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@warehouse:5432/urban
      DATA_DIR: /data
      SIMULATION_WORK_DIR: /runtime/solvers
    ports:
      - "127.0.0.1:${KHOI_API_PORT:-8001}:8000"
    volumes:
      - ./data:/data:ro
      - khoi_simulation_runtime:/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      warehouse:
        condition: service_healthy
  etl:
    build: ./etl
    environment:
      DATABASE_URL: postgresql://urban:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@warehouse:5432/urban
      DATA_DIR: /data
    volumes:
      - ./data:/data
    profiles: ["etl"]
    depends_on:
      warehouse:
        condition: service_healthy
  etl-service:
    build: ./etl
    entrypoint: ["python", "-m", "src.khoi_service"]
    command: []
    entrypoint: []
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://urban:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@warehouse:5432/urban
      DATA_DIR: /data
      HCMC_BOUNDARY: /data/inputs/hcmc_expanded_boundary.geojson
      RAIN_GRID_M: ${RAIN_GRID_M:-10000}
      RAIN_BATCH_SIZE: ${RAIN_BATCH_SIZE:-10}
      RAIN_HISTORY_STATIONS_PER_RUN: ${RAIN_HISTORY_STATIONS_PER_RUN:-4}
      RAIN_HISTORY_START_YEAR: ${RAIN_HISTORY_START_YEAR:-2016}
      RAIN_HISTORY_END_YEAR: ${RAIN_HISTORY_END_YEAR:-}
      RAIN_REFRESH_SECONDS: ${RAIN_REFRESH_SECONDS:-3600}
      RAIN_HISTORY_REFRESH_SECONDS: ${RAIN_HISTORY_REFRESH_SECONDS:-300}
      SATELLITE_REFRESH_SECONDS: ${SATELLITE_REFRESH_SECONDS:-21600}
      FLOOD_HISTORY_REFRESH_SECONDS: ${FLOOD_HISTORY_REFRESH_SECONDS:-604800}
      LAND_PRICE_REFRESH_SECONDS: ${LAND_PRICE_REFRESH_SECONDS:-2592000}
    volumes:
      - ./data:/data
    profiles: ["etl-service"]
    depends_on:
      warehouse:
        condition: service_healthy
volumes:
  khoi_database:
  khoi_simulation_runtime:
