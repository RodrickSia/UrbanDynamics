name: Run ETL pipelines

on:
  workflow_dispatch:
    inputs:
      pipeline:
        description: ETL pipeline to run
        type: choice
        required: true
        default: population_hcmc
        options:
          - all
          - population_hcmc
          - flood_history
          - flood_satellite
          - flood_risk
          - land_price
      stage:
        description: ETL stage to run
        type: choice
        required: true
        default: all
        options:
          - all
          - extract

permissions:
  contents: read

concurrency:
  group: urbandynamics-etl
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.pipeline }} ETL
    environment: production
    env:
      WAREHOUSE_DATABASE: ${{ vars.WAREHOUSE_DATABASE || 'urbandynamics' }}
      WAREHOUSE_USER: ${{ vars.WAREHOUSE_USER || 'urbandynamics' }}
      WAREHOUSE_PASSWORD: ${{ secrets.WAREHOUSE_PASSWORD }}
    # This runner needs Docker, database access, and persistent space for WorldPop files.
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep ignored ETL inputs and downloads between runs on this self-hosted runner.
          clean: false
      - name: Run selected pipeline
        env:
          ETL_PIPELINE: ${{ inputs.pipeline }}
          ETL_STAGE: ${{ inputs.stage }}
        run: |
          set -eu
          test -n "$WAREHOUSE_PASSWORD" || { echo "Set WAREHOUSE_PASSWORD in the production environment." >&2; exit 1; }
          created_env=false
          if [ ! -f .env ]; then
            cp .env.example .env
            created_env=true
          fi
          trap 'if [ "$created_env" = true ]; then rm -f .env; fi' EXIT
          if ! docker compose ps --status running --services | grep -Fxq postgis; then
            echo "The PostGIS service must be running and migrated before running ETL." >&2
            exit 1
          fi
          migration_query="SELECT to_regclass('public.layer_snapshots') IS NOT NULL AND to_regclass('public.layer_features') IS NOT NULL AND EXISTS (SELECT 1 FROM public.schema_migrations WHERE version = '001_khoi_layers.sql')"
          if ! docker compose exec -T postgis sh -c \
            'psql -X --set ON_ERROR_STOP=1 --tuples-only --no-align --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --command "$1"' \
            sh "$migration_query" | grep -Fxq t; then
            echo "::error::The vector-layer migration is missing. Run the protected Deploy database workflow before this ETL job." >&2
            exit 1
          fi

          prepare_boundary() {
            if [ -s etl/data/inputs/thu_duc_boundary.geojson ]; then
              return
            fi
            local service=etl-flood-history
            echo "Preparing the Thu Duc boundary from the published DataSuds boundary dataset."
            docker compose --profile "$service" build "$service"
            docker compose --profile "$service" run --rm --entrypoint python "$service" /app/scripts/prepare-khoi-data.py boundary
          }

          run_pipeline() {
            local pipeline="$1"
            local service="etl-${pipeline//_/-}"
            local -a arguments=()
            case "$pipeline" in
              flood_history|flood_satellite)
                prepare_boundary
                arguments=(--boundary /app/data/inputs/thu_duc_boundary.geojson)
                ;;
              flood_risk)
                test -s etl/data/inputs/rainfall_forecast.json || { echo "Missing rainfall forecast input." >&2; exit 1; }
                test -s etl/data/inputs/rainfall_history.json || { echo "Missing rainfall history input." >&2; exit 1; }
                arguments=(--weather-input /app/data/inputs/rainfall_forecast.json --history-input /app/data/inputs/rainfall_history.json)
                ;;
              land_price)
                test -s etl/data/review/land_price_reviewed.geojson || { echo "Review land-price rows and segments before publishing." >&2; exit 1; }
                arguments=(--segments /app/data/review/land_price_reviewed.geojson)
                ;;
            esac
            docker compose --profile "$service" build "$service"
            echo "Running pipeline: $pipeline"
            docker compose --profile "$service" run --rm "$service" run --stage all "${arguments[@]}"
          }

          if [ "$ETL_PIPELINE" = all ]; then
            if [ "$ETL_STAGE" != all ]; then
              echo "::error::The all pipeline selection runs the complete ETL only; select stage all." >&2
              exit 1
            fi
            prepare_boundary
            skipped=()
            for pipeline in population_hcmc flood_history flood_satellite flood_risk land_price; do
              if [ "$pipeline" = flood_risk ] && { [ ! -s etl/data/inputs/rainfall_forecast.json ] || [ ! -s etl/data/inputs/rainfall_history.json ]; }; then
                echo "::warning::Skipping flood_risk: rainfall forecast/history inputs are missing."
                skipped+=(flood_risk)
                continue
              fi
              if [ "$pipeline" = land_price ] && [ ! -s etl/data/review/land_price_reviewed.geojson ]; then
                echo "::warning::Skipping land_price: reviewed land-price segments are missing."
                skipped+=(land_price)
                continue
              fi
              run_pipeline "$pipeline"
            done
            if [ "${#skipped[@]}" -gt 0 ]; then
              printf 'Skipped pipelines due to missing inputs: %s\n' "${skipped[*]}" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            service="etl-${ETL_PIPELINE//_/-}"
            docker compose --profile "$service" build "$service"
            case "$ETL_PIPELINE" in
              flood_history|flood_satellite)
                prepare_boundary
                set -- --boundary /app/data/inputs/thu_duc_boundary.geojson
                ;;
              flood_risk)
                test -s etl/data/inputs/rainfall_forecast.json || { echo "Missing rainfall forecast input." >&2; exit 1; }
                test -s etl/data/inputs/rainfall_history.json || { echo "Missing rainfall history input." >&2; exit 1; }
                set -- --weather-input /app/data/inputs/rainfall_forecast.json --history-input /app/data/inputs/rainfall_history.json
                ;;
              land_price)
                test -s etl/data/review/land_price_reviewed.geojson || { echo "Review land-price rows and segments before publishing." >&2; exit 1; }
                set -- --segments /app/data/review/land_price_reviewed.geojson
                ;;
              *) set -- ;;
            esac
            docker compose --profile "$service" run --rm "$service" run --stage "$ETL_STAGE" "$@"
          fi
