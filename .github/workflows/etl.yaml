name: Run ETL pipelines

on:
  workflow_dispatch:
    inputs:
      pipeline:
        description: ETL pipeline to run
        type: choice
        required: true
        default: population_hcmc
        options:
          - all
          - population_hcmc
          - flood_history
          - flood_satellite
          - flood_risk
          - land_price
      stage:
        description: ETL stage to run
        type: choice
        required: true
        default: all
        options:
          - all
          - extract

permissions:
  contents: read

concurrency:
  group: urbandynamics-etl
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.pipeline }} ETL
    environment: production
    env:
      WAREHOUSE_DATABASE: ${{ vars.WAREHOUSE_DATABASE || 'urbandynamics' }}
      WAREHOUSE_USER: ${{ vars.WAREHOUSE_USER || 'urbandynamics' }}
      WAREHOUSE_PASSWORD: ${{ secrets.WAREHOUSE_PASSWORD }}
    # This runner needs Docker, database access, and persistent space for WorldPop files.
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep ignored ETL inputs and downloads between runs on this self-hosted runner.
          clean: false
      - name: Run selected pipeline
        env:
          ETL_PIPELINE: ${{ inputs.pipeline }}
          ETL_STAGE: ${{ inputs.stage }}
        run: |
          set -eu
          test -n "$WAREHOUSE_PASSWORD" || { echo "Set WAREHOUSE_PASSWORD in the production environment." >&2; exit 1; }
          created_env=false
          if [ ! -f .env ]; then
            cp .env.example .env
            created_env=true
          fi
          trap 'if [ "$created_env" = true ]; then rm -f .env; fi' EXIT
          if ! docker compose ps --status running --services | grep -Fxq postgis; then
            echo "The PostGIS service must be running and migrated before running ETL." >&2
            exit 1
          fi
          migration_query="SELECT to_regclass('public.layer_snapshots') IS NOT NULL AND to_regclass('public.layer_features') IS NOT NULL AND EXISTS (SELECT 1 FROM public.schema_migrations WHERE version = '001_khoi_layers.sql')"
          if ! docker compose exec -T postgis sh -c \
            'psql -X --set ON_ERROR_STOP=1 --tuples-only --no-align --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --command "$1"' \
            sh "$migration_query" | grep -Fxq t; then
            echo "::error::The vector-layer migration is missing. Run the protected Deploy database workflow before this ETL job." >&2
            exit 1
          fi

          prepare_boundary() {
            if [ -s etl/data/inputs/thu_duc_boundary.geojson ]; then
              return
            fi
            local service=etl-flood-history
            echo "Preparing the Thu Duc boundary from the published DataSuds boundary dataset."
            docker compose --profile "$service" build "$service"
            docker compose --profile "$service" run --rm --entrypoint python "$service" /app/scripts/prepare-khoi-data.py boundary
          }

          prepare_rainfall_inputs() {
            local service=etl-flood-risk
            echo "Refreshing the Open-Meteo rainfall forecast and creating history input if it is not cached."
            docker compose --profile "$service" build "$service" || return 1
            docker compose --profile "$service" run --rm --entrypoint python "$service" /app/scripts/prepare-khoi-data.py weather || return 1
            [ -s etl/data/inputs/rainfall_forecast.json ] && [ -s etl/data/inputs/rainfall_history.json ]
          }

          prepare_land_price_candidates() {
            if [ -s etl/data/review/land_price_reviewed.geojson ]; then
              return 0
            fi
            local service=etl-land-price
            docker compose --profile "$service" build "$service" || return 1
            if [ ! -s etl/data/review/land_price_rows.json ]; then
              test -s etl/data/raw/land_price/official-annex-2026.pdf || {
                echo "::error::The checked-in land-price annex PDF is missing." >&2
                return 1
              }
              echo "Extracting candidate rows from the checked-in official land-price annex."
              docker compose --profile "$service" run --rm "$service" run --stage extract || return 1
            fi
            if [ ! -s etl/data/review/land_price_candidates.geojson ]; then
              echo "Downloading OSM roads and creating unreviewed land-price segment candidates."
              docker compose --profile "$service" run --rm --entrypoint python "$service" /app/scripts/prepare-land-road-review.py || return 1
            fi
            echo "Land-price candidates are in etl/data/review/land_price_candidates.geojson; human verification is required before publishing."
          }

          run_pipeline() {
            local pipeline="$1"
            local service="etl-${pipeline//_/-}"
            local -a arguments=()
            case "$pipeline" in
              flood_history|flood_satellite)
                prepare_boundary
                arguments=(--boundary /app/data/inputs/thu_duc_boundary.geojson)
                ;;
            flood_risk)
                prepare_rainfall_inputs || { echo "Could not prepare rainfall inputs for flood_risk." >&2; exit 1; }
                arguments=(--weather-input /app/data/inputs/rainfall_forecast.json --history-input /app/data/inputs/rainfall_history.json)
                ;;
              land_price)
                prepare_land_price_candidates || { echo "Could not prepare land-price candidates." >&2; exit 1; }
                test -s etl/data/review/land_price_reviewed.geojson || { echo "Review etl/data/review/land_price_candidates.geojson, save approved segments as land_price_reviewed.geojson, then retry." >&2; exit 1; }
                arguments=(--segments /app/data/review/land_price_reviewed.geojson)
                ;;
            esac
            docker compose --profile "$service" build "$service"
            echo "Running pipeline: $pipeline"
            docker compose --profile "$service" run --rm "$service" run --stage all "${arguments[@]}"
          }

          if [ "$ETL_PIPELINE" = all ]; then
            if [ "$ETL_STAGE" != all ]; then
              echo "::error::The all pipeline selection runs the complete ETL only; select stage all." >&2
              exit 1
            fi
            prepare_boundary
            rainfall_ready=true
            if ! prepare_rainfall_inputs; then
              rainfall_ready=false
              echo "::warning::Could not fetch rainfall inputs; flood_risk will be skipped."
            fi
            land_price_review_ready=true
            if ! prepare_land_price_candidates; then
              land_price_review_ready=false
              echo "::warning::Could not download/extract land-price candidates; land_price will be skipped."
            fi
            skipped=()
            for pipeline in population_hcmc flood_history flood_satellite flood_risk land_price; do
              if [ "$pipeline" = flood_risk ] && [ "$rainfall_ready" != true ]; then
                echo "::warning::Skipping flood_risk: forecast/history inputs could not be prepared."
                skipped+=(flood_risk)
                continue
              fi
              if [ "$pipeline" = land_price ] && { [ "$land_price_review_ready" != true ] || [ ! -s etl/data/review/land_price_reviewed.geojson ]; }; then
                echo "::warning::Skipping land_price: reviewed segments are not available. Candidates are prepared for human review."
                skipped+=(land_price)
                continue
              fi
              run_pipeline "$pipeline"
            done
            if [ "${#skipped[@]}" -gt 0 ]; then
              printf 'Skipped pipelines due to missing inputs: %s\n' "${skipped[*]}" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            service="etl-${ETL_PIPELINE//_/-}"
            docker compose --profile "$service" build "$service"
            case "$ETL_PIPELINE" in
              flood_history|flood_satellite)
                prepare_boundary
                set -- --boundary /app/data/inputs/thu_duc_boundary.geojson
                ;;
              flood_risk)
                prepare_rainfall_inputs || { echo "Could not prepare rainfall inputs for flood_risk." >&2; exit 1; }
                set -- --weather-input /app/data/inputs/rainfall_forecast.json --history-input /app/data/inputs/rainfall_history.json
                ;;
              land_price)
                prepare_land_price_candidates || { echo "Could not prepare land-price candidates." >&2; exit 1; }
                test -s etl/data/review/land_price_reviewed.geojson || { echo "Review etl/data/review/land_price_candidates.geojson, save approved segments as land_price_reviewed.geojson, then retry." >&2; exit 1; }
                set -- --segments /app/data/review/land_price_reviewed.geojson
                ;;
              *) set -- ;;
            esac
            docker compose --profile "$service" run --rm "$service" run --stage "$ETL_STAGE" "$@"
          fi
