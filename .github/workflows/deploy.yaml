name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urbandynamics-deploy
  cancel-in-progress: false

jobs:
  main-web:
    environment: production
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Package the reviewed main revision
        run: git bundle create "$RUNNER_TEMP/main-web.bundle" HEAD
      - name: Deploy main web with persistent server configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          source = Path(os.environ['GITHUB_WORKSPACE']) / 'scripts/deploy-main-agent.py'
          root = Path('/GuestShare_NAS/WorkingSpace/Personal/nguyenmv/MLAI/UrbanDynamics/UrbanDynamics')
          if not (root / '.git').exists():
              raise SystemExit('This workflow must run on server 156 with the existing team checkout')
          script = root / 'scripts/deploy-main-agent.py'
          sys.argv = [str(script), '--bundle', str(Path(os.environ['RUNNER_TEMP']) / 'main-web.bundle')]
          exec(compile(source.read_text(), str(script), 'exec'), {'__name__': '__main__', '__file__': str(script)})
          PY
      - name: Verify main frontend and agent
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          base = 'http://127.0.0.1:51873'
          for path in ['/', '/api/v1/openapi.json']:
              with urllib.request.urlopen(base + path, timeout=30) as response:
                  assert response.status == 200
          with urllib.request.urlopen(base + '/api/v1/agent/config', timeout=30) as response:
              config = json.load(response)
          assert config['enabled'] and config['model_configured']
          print('Main web and agent are available on port 51873')
          PY
      - name: Verify published map data
        run: python3 scripts/smoke_map_deployment.py http://127.0.0.1:51873
      - name: Remove temporary source bundle
        if: always()
        run: python3 -c "import os; from pathlib import Path; (Path(os.environ['RUNNER_TEMP']) / 'main-web.bundle').unlink(missing_ok=True)"
