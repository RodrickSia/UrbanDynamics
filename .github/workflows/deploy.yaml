name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urbandynamics-deploy
  cancel-in-progress: false

jobs:
  backend:
    environment: production
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Package the reviewed main revision
        run: git bundle create "$RUNNER_TEMP/main-backend.bundle" HEAD
      - name: Deploy backend and workers
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          source = Path(os.environ['GITHUB_WORKSPACE']) / 'scripts/deploy-main-agent.py'
          root = Path('/GuestShare_NAS/WorkingSpace/Personal/nguyenmv/MLAI/UrbanDynamics/UrbanDynamics')
          if not (root / '.git').exists():
              raise SystemExit('This workflow must run on server 156 with the existing team checkout')
          script = root / 'scripts/deploy-main-agent.py'
          sys.argv = [str(script), '--bundle', str(Path(os.environ['RUNNER_TEMP']) / 'main-backend.bundle'), '--backend-only']
          exec(compile(source.read_text(), str(script), 'exec'), {'__name__': '__main__', '__file__': str(script)})
          PY
      - name: Verify backend API through the current frontend proxy
        run: curl --fail --silent --show-error --retry 10 --retry-delay 3 http://127.0.0.1:51873/api/v1/openapi.json >/dev/null
      - name: Remove temporary source bundle
        if: always()
        run: python3 -c "import os; from pathlib import Path; (Path(os.environ['RUNNER_TEMP']) / 'main-backend.bundle').unlink(missing_ok=True)"

  frontend:
    needs: backend
    environment: production
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Package the reviewed main revision
        run: git bundle create "$RUNNER_TEMP/main-frontend.bundle" HEAD
      - name: Deploy frontend
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          source = Path(os.environ['GITHUB_WORKSPACE']) / 'scripts/deploy-main-agent.py'
          root = Path('/GuestShare_NAS/WorkingSpace/Personal/nguyenmv/MLAI/UrbanDynamics/UrbanDynamics')
          if not (root / '.git').exists():
              raise SystemExit('This workflow must run on server 156 with the existing team checkout')
          script = root / 'scripts/deploy-main-agent.py'
          sys.argv = [str(script), '--bundle', str(Path(os.environ['RUNNER_TEMP']) / 'main-frontend.bundle'), '--frontend-only']
          exec(compile(source.read_text(), str(script), 'exec'), {'__name__': '__main__', '__file__': str(script)})
          PY
      - name: Verify frontend and published map data
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 http://127.0.0.1:51873/ >/dev/null
          python3 scripts/smoke_map_deployment.py http://127.0.0.1:51873
      - name: Remove temporary source bundle
        if: always()
        run: python3 -c "import os; from pathlib import Path; (Path(os.environ['RUNNER_TEMP']) / 'main-frontend.bundle').unlink(missing_ok=True)"
