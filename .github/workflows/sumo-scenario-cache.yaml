name: Run one six-hour SUMO traffic scenario

on:
  workflow_dispatch:
    inputs:
      weekday:
        description: Scenario weekday (Monday=1, Sunday=7)
        required: true
        type: choice
        default: '1'
        options: ['1', '2', '3', '4', '5', '6', '7']
      start_time:
        description: Scenario start time in HCMC (half-hour boundary)
        required: true
        type: string
        default: '08:00'
      runner:
        description: Runner where the scenario should be queued
        required: true
        default: gpu156
        type: choice
        options: [gpu156, aws-singapore]

permissions:
  contents: read

concurrency:
  group: sumo-scenario-cache
  queue: max

jobs:
  precompute:
    name: Enqueue one six-hour scenario
    runs-on: ${{ inputs.runner == 'gpu156' && fromJSON('["self-hosted","Linux","X64","gpu156"]') || fromJSON('["self-hosted","Linux","X64","aws","singapore","m7i-flex-large"]') }}
    timeout-minutes: 15
    environment: production
    env:
      WAREHOUSE_DATABASE: ${{ vars.WAREHOUSE_DATABASE || 'urbandynamics' }}
      WAREHOUSE_USER: ${{ vars.WAREHOUSE_USER || 'urbandynamics' }}
      WAREHOUSE_PASSWORD: ${{ secrets.WAREHOUSE_PASSWORD }}
      SUMO_WEEKDAY: ${{ inputs.weekday || '1' }}
      SUMO_START_TIME: ${{ inputs.start_time || '08:00' }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify deployed SUMO worker and cache migration
        run: |
          set -eu
          test -n "$WAREHOUSE_PASSWORD" || { echo "Set WAREHOUSE_PASSWORD in the production environment." >&2; exit 1; }
          created_env=false
          if [ ! -f .env ]; then
            cp .env.example .env
            created_env=true
          fi
          trap 'if [ "$created_env" = true ]; then rm -f .env; fi' EXIT
          docker compose --env-file .env ps --status running --services | grep -Fxq traffic-prediction-worker || {
            echo "::error::The dedicated SUMO worker is not running. Deploy/start it separately before enqueueing." >&2
            exit 1
          }
          docker compose --env-file .env ps --status running --services | grep -Fxq postgis || {
            echo "::error::PostGIS is not running. Start the database separately before enqueueing." >&2
            exit 1
          }
          docker compose --env-file .env exec -T postgis sh -c \
            'psql -X --set ON_ERROR_STOP=1 --tuples-only --no-align --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --command "$1"' \
            sh "SELECT to_regclass('transport.sumo_congestion_scenario_cache') IS NOT NULL AND EXISTS (SELECT 1 FROM public.schema_migrations WHERE version = '12-sumo-congestion-scenario-cache.sql')" | grep -Fxq t || {
              echo "::error::SUMO scenario-cache migration is missing. Run the Deploy database workflow first." >&2
              exit 1
            }
      - name: Enqueue selected six-hour scenario
        run: |
          set -eu
          created_env=false
          if [ ! -f .env ]; then
            cp .env.example .env
            created_env=true
          fi
          trap 'if [ "$created_env" = true ]; then rm -f .env; fi' EXIT
          docker compose --env-file .env exec -T traffic-prediction-worker \
            python -m app.services.traffic_sumo_batch --weekday "$SUMO_WEEKDAY" --period "$SUMO_START_TIME" --enqueue-only
