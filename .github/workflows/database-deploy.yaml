name: Deploy database migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    environment: production
    env:
      WAREHOUSE_DATABASE: ${{ vars.WAREHOUSE_DATABASE || 'urbandynamics' }}
      WAREHOUSE_USER: ${{ vars.WAREHOUSE_USER || 'urbandynamics' }}
      WAREHOUSE_PASSWORD: ${{ secrets.WAREHOUSE_PASSWORD }}
    # Configure this label to match the private self-hosted runner.
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending database migrations
        env:
          WAREHOUSE_MIGRATION_TARGET: compose
        run: |
          set -eu
          test -n "$WAREHOUSE_PASSWORD" || { echo "Set WAREHOUSE_PASSWORD in the production environment." >&2; exit 1; }
          created_env=false
          if [ ! -f .env ]; then
            umask 077
            printf 'BACKEND_PORT=8000\nFRONTEND_PORT=8080\nWAREHOUSE_DATABASE=%s\nWAREHOUSE_USER=%s\nWAREHOUSE_PASSWORD=%s\nWAREHOUSE_FORWARD_PORT=5432\n' \
              "$WAREHOUSE_DATABASE" "$WAREHOUSE_USER" "$WAREHOUSE_PASSWORD" > .env
            created_env=true
          fi
          trap 'if [ "$created_env" = true ]; then rm -f .env; fi' EXIT
          if ! docker compose ps --status running --services | grep -Fxq postgis; then
            echo "The PostGIS service must already be running. Deploy the Compose stack first." >&2
            exit 1
          fi
          sh infra/warehouse/scripts/migrate.sh
