name: traffic_feat — Run all three traffic pipelines

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traffic-feature-etl
  cancel-in-progress: false

jobs:
  run:
    name: traffic_feat — OSM/SUMO → traffic history → TomTom
    runs-on: [self-hosted, linux]
    environment: production
    env:
      WAREHOUSE_DATABASE: ${{ vars.WAREHOUSE_DATABASE || 'urbandynamics' }}
      WAREHOUSE_USER: ${{ vars.WAREHOUSE_USER || 'urbandynamics' }}
      WAREHOUSE_PASSWORD: ${{ secrets.WAREHOUSE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Preserve generated ETL outputs on the self-hosted runner.
          clean: false
      - name: Validate seeded traffic inputs
        run: |
          set -eu
          test -n "$WAREHOUSE_PASSWORD" || { echo "Set WAREHOUSE_PASSWORD in the production environment." >&2; exit 1; }
          for source in \
            etl/data/osm_sumo_hcmc/hcmc.osm.pbf \
            etl/data/traffic_history/traffic.csv \
            etl/data/road_data_tomtom/tomtom_hcmc_traffic_sample.csv; do
            if [ ! -s "$source" ]; then
              echo "::error::Required seeded traffic input is missing or empty: $source" >&2
              exit 1
            fi
          done
      - name: Run sequential traffic feature pipeline
        env:
          WAREHOUSE_MIGRATION_TARGET: compose
        run: |
          set -eu
          created_env=false
          if [ ! -f .env ]; then
            cp .env.example .env
            created_env=true
          fi
          trap 'if [ "$created_env" = true ]; then rm -f .env; fi' EXIT
          if ! docker compose ps --status running --services | grep -Fxq postgis; then
            echo "The PostGIS service must be running and migrated before traffic_feat." >&2
            exit 1
          fi
          migration_query="SELECT to_regclass('transport.sumo_edge') IS NOT NULL AND to_regclass('transport.traffic_observation') IS NOT NULL AND to_regclass('transport.tomtom_traffic_observation') IS NOT NULL AND to_regclass('transport.sumo_congestion_run') IS NOT NULL AND EXISTS (SELECT 1 FROM public.schema_migrations WHERE version = '07-sumo-road-network.sql') AND EXISTS (SELECT 1 FROM public.schema_migrations WHERE version = '08-traffic-history.sql') AND EXISTS (SELECT 1 FROM public.schema_migrations WHERE version = '09-traffic-speed-comparison.sql') AND EXISTS (SELECT 1 FROM public.schema_migrations WHERE version = '10-tomtom-traffic-observation.sql') AND EXISTS (SELECT 1 FROM public.schema_migrations WHERE version = '11-sumo-congestion-simulation.sql')"
          if ! docker compose exec -T postgis sh -c \
            'psql -X --set ON_ERROR_STOP=1 --tuples-only --no-align --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --command "$1"' \
            sh "$migration_query" | grep -Fxq t; then
            echo "::error::Required SUMO/traffic migrations are missing. Run the protected Deploy database workflow first." >&2
            exit 1
          fi
          ./pipelines/traffic_feat.sh
