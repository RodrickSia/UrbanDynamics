name: Khoi pipelines and API
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: urban_test
          POSTGRES_USER: urban_test
          POSTGRES_PASSWORD: local_ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urban_test -d urban_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            etl/requirements.txt
            backend/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=test-results/khoi-ci.xml
        env:
          TEST_DATABASE_URL: postgresql://urban_test:local_ci_test_only@localhost:5432/urban_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: khoi-test-results
          path: test-results/
