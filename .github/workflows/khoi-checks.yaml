name: Khoi pipelines and API
on:
  push:
  pull_request:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            etl/requirements.txt
            backend/pyproject.toml
            backend/uv.lock
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.6
      - name: Build the shared warehouse test image
        run: docker build -t khoi-ci-warehouse infra/warehouse
      - name: Start temporary PostGIS with a generated password
        shell: bash
        run: |
          db_password=$(openssl rand -hex 32)
          echo "::add-mask::$db_password"
          echo "TEST_DATABASE_URL=postgresql://urban_test:${db_password}@127.0.0.1:5432/urban_test" >> "$GITHUB_ENV"
          echo "WAREHOUSE_PASSWORD=$db_password" >> "$GITHUB_ENV"
          echo "WAREHOUSE_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "WAREHOUSE_PORT=5432" >> "$GITHUB_ENV"
          echo "WAREHOUSE_DATABASE=urban_test" >> "$GITHUB_ENV"
          echo "WAREHOUSE_USER=urban_test" >> "$GITHUB_ENV"
          echo "POSTGIS_TESTS=1" >> "$GITHUB_ENV"
          POSTGRES_PASSWORD="$db_password" docker run --detach --name khoi-ci-postgis \
            -e POSTGRES_PASSWORD -e POSTGRES_USER=urban_test -e POSTGRES_DB=urban_test \
            -p 127.0.0.1:5432:5432 \
            --health-cmd "pg_isready -h 127.0.0.1 -U urban_test -d urban_test" \
            --health-interval 2s --health-timeout 5s --health-retries 30 \
            khoi-ci-warehouse
          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' khoi-ci-postgis)
            if [ "$status" = "healthy" ]; then exit 0; fi
            if [ "$status" = "unhealthy" ]; then break; fi
            sleep 2
          done
          echo "PostGIS failed to become healthy"
          exit 1
      - name: Native SUMO runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libexpat1 libgomp1 libatomic1 libx11-6 libxext6 libxrender1 libgl1
      - name: Install locked backend and ETL test dependencies
        run: |
          uv export --project backend --frozen --no-dev --format requirements.txt --output-file /tmp/khoi-backend-requirements.txt
          python -m pip install -r /tmp/khoi-backend-requirements.txt
          python -m pip install -r etl/requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=test-results/khoi-ci.xml
      - name: Stop temporary database
        if: always()
        run: docker rm -f khoi-ci-postgis || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: khoi-test-results
          path: test-results/
