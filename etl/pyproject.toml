[project]
name = "etl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rodricksia", email = "doquocduy698@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<2",
    "geopandas>=1.0,<2",
    "mapbox-vector-tile>=2.1,<3",
    "mercantile>=1.2.1,<2",
    "numpy>=2,<3",
    "pdfplumber>=0.11,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.13.5,<3",
    "rasterio>=1.4,<2",
    "requests>=2.32,<3",
]

[project.scripts]
etl = "etl:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
